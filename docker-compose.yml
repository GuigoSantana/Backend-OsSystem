version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ordem_servico_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=ordem_servico
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: ordem_servico_api
    ports:
      - "3333:3333"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://admin:admin@db:5432/ordem_servico?schema=public
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  pgdata:

